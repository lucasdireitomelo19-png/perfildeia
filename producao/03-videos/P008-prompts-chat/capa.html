<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P008: capa, CTA e fundo do Reels (1080×1920)</title>
<link rel="stylesheet" href="../../../marca/carrossel/base.css">
<style>
  /* Adaptação do kit do carrossel para 9:16. Área central 4:5 = y 285 a 1635. */
  .tela { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: var(--off); margin-bottom: 20px; }
  .area45 { position: absolute; left: 0; right: 0; top: 285px; height: 1350px; padding: 90px 96px; display: flex; flex-direction: column; gap: 44px; justify-content: flex-start; padding-top: 120px; }
  .estrelas { font-family: "Space Grotesk"; font-weight: 700; font-size: 200px; line-height: .95; white-space: nowrap; letter-spacing: -0.04em; color: var(--azul); display: flex; align-items: center; gap: 28px; }
  .estrela { width: 140px; height: 140px; flex: none; }
  .titulo--capa { font-size: 124px; }
  .mini { padding: 34px 36px 40px; display: flex; flex-direction: column; gap: 22px; }
  .card { display: flex; align-items: center; gap: 22px; background: var(--off); border-radius: 18px; padding: 22px 26px; }
  .card .barra { height: 18px; border-radius: 9px; background: #DADCE2; }
  .card .ico { width: 34px; height: 34px; border-radius: 8px; background: var(--azul); flex: none; }
  .card .ico--v { background: var(--verde); }
  .card .ico--c { background: #C9CCD3; }
  .rodape9 { position: absolute; left: 96px; right: 96px; bottom: 375px; display: flex; justify-content: space-between; align-items: center; font-family: "Space Grotesk"; font-weight: 700; font-size: 40px; }
  .rodape9 .ia { color: var(--azul); }
  /* CTA */
  .cta-centro { position: absolute; left: 0; right: 0; top: 250px; bottom: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; text-align: center; padding: 0 80px; }
  .cta-pre { font-family: "Space Grotesk"; font-weight: 500; font-size: 84px; letter-spacing: -0.02em; }
  .cta-palavra { font-family: "Space Grotesk"; font-weight: 700; font-size: 220px; letter-spacing: -0.04em; color: var(--azul); line-height: 1; }
  .cta-sub { font-size: 50px; line-height: 1.35; font-weight: 500; max-width: 860px; }
  .fonte { position: absolute; left: 0; right: 0; bottom: 420px; text-align: center; font-size: 34px; color: var(--cinza); }
  /* Fundo com janela para as gravações */
  .janela-fundo { position: absolute; left: 60px; top: 470px; width: 960px; height: 980px; background: var(--branco); border-radius: 28px; box-shadow: 0 18px 50px rgba(20,22,26,.12); }
  .janela-fundo .bar { height: 70px; border-bottom: 1px solid #EEE; padding: 0 28px; display: flex; align-items: center; gap: 14px; }
  .janela-fundo .bar i { width: 18px; height: 18px; border-radius: 50%; background: #C9CCD3; display: block; }
</style>
</head>
<body>

<!-- 1. CAPA (texto: "+170 mil" + "Prompt pronto pra tudo.") -->
<section class="tela" id="capa">
  <div class="area45">
    <div class="estrelas">
      <svg class="estrela" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2F3BFF" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9z"/></svg>
      <span>+170 mil</span>
    </div>
    <h1 class="titulo titulo--capa">Prompt pronto pra <span class="mt">tudo</span><span class="ponto"></span></h1>
    <div class="janela" style="transform: rotate(-2.5deg); margin-top: 10px;">
      <div class="mini">
        <div class="card"><span class="ico"></span><span class="barra" style="width:62%"></span><span class="barra" style="width:14%; margin-left:auto"></span></div>
        <div class="card"><span class="ico ico--v"></span><span class="barra" style="width:48%"></span><span class="barra" style="width:14%; margin-left:auto"></span></div>
      </div>
    </div>
  </div>
  <div class="rodape9"><span class="logo"><span class="ia">IA</span>works.</span></div>
</section>

<!-- 2. CTA (32–38 s) -->
<section class="tela" id="cta">
  <div class="cta-centro">
    <p class="cta-pre">Comenta</p>
    <p class="cta-palavra">PROMPT</p>
    <p class="cta-sub">que eu te mando o link e o truque pra usar em português</p>
  </div>
  <p class="fonte">Fonte: prompts.chat</p>
</section>

<!-- 3. FUNDO COM JANELA (camada de baixo das gravações) -->
<section class="tela" id="fundo-janela">
  <div class="janela-fundo"><div class="bar"><i></i><i></i><i></i></div></div>
</section>

</body>
</html>
